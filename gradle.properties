# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Parallel builds are fine for a single-module project and speed up incremental work.
org.gradle.parallel=true
org.gradle.caching=true

# NOTE: Gradle configuration cache is intentionally left OFF.
# In the sibling Kotlin pet-project (orm-nplus1-radar) enabling
# org.gradle.configuration-cache=true produced spurious serialization errors on
# some Gradle/plugin combinations. Ktor's application/shadow tooling has no need
# for it here, so we avoid the class of failure entirely. Re-enable only after
# verifying a clean `./gradlew build --configuration-cache` on the target machine.
# org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
