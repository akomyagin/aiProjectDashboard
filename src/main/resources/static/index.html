<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aiProjectDashboard</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #12141a; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #262a33; display: flex; align-items: center; gap: 16px; }
    h1 { font-size: 18px; margin: 0; }
    nav button { background: #1e222b; color: #e6e6e6; border: 1px solid #2e333d; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    nav button.active { background: #2d6cdf; border-color: #2d6cdf; }
    main { padding: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21252e; font-size: 14px; }
    th { color: #8a94a6; font-weight: 600; }
    .ok { color: #3ddc84; } .fail { color: #ff5c5c; } .pending { color: #ffcc00; } .unknown { color: #8a94a6; }
    .prio { font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #1e222b; }
    .p5,.p4 { color:#ff5c5c;} .p3{color:#ffcc00;} .p2,.p1{color:#8a94a6;}
    .muted { color: #8a94a6; }
    code { background:#1e222b; padding: 1px 5px; border-radius: 4px; }
    tr.stale td { opacity: 0.6; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
    .tag-cached { background:#2e333d; color:#8a94a6; }
    .tag-changed { background:#3a2f12; color:#ffcc00; }
    #summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    #summary .card { background: #1e222b; border: 1px solid #2e333d; border-radius: 8px; padding: 10px 16px; min-width: 160px; }
    #summary .card .label { color: #8a94a6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    #summary .card .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
    #summary .card a { color: #e6e6e6; }
    #summary .card .sub { font-size: 12px; color: #8a94a6; margin-top: 2px; }
    #summary .prios { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>aiProjectDashboard</h1>
    <nav>
      <button id="tab-status" class="active" onclick="show('status')">Portfolio status</button>
      <button id="tab-todos" onclick="show('todos')">TODOs</button>
    </nav>
    <span id="loading" class="muted"></span>
  </header>
  <main>
    <div id="summary"></div>
    <div id="view"></div>
  </main>

  <script>
    const ci = c => ({SUCCESS:['ok','✔ ok'],FAILURE:['fail','✘ fail'],PENDING:['pending','… running'],UNKNOWN:['unknown','? unknown']}[c] || ['unknown','?']);

    function renderSummary(statusRows, todoRows) {
      const summary = document.getElementById('summary');
      const totalOpenPrs = statusRows.reduce((a, r) => a + (r.openPrs || 0), 0);
      const redCi = statusRows.filter(r => r.ci === 'FAILURE').length;

      const oldest = statusRows
        .filter(r => r.oldestOpenPr)
        .map(r => ({ repo: r.fullName, ...r.oldestOpenPr }))
        .sort((a, b) => a.createdAt.localeCompare(b.createdAt))[0];
      const oldestHtml = oldest
        ? `<a href="${/^https:\/\//.test(oldest.url) ? esc(oldest.url) : '#'}" target="_blank" rel="noopener">${esc(oldest.repo)}#${oldest.number}</a>` +
          `<div class="sub">${esc(oldest.title)}</div><div class="sub">since ${esc((oldest.createdAt||'').slice(0,10))}</div>`
        : '<span class="muted">no open PRs</span>';

      const byPrio = todoRows.reduce((m, t) => (m[t.priority] = (m[t.priority]||0) + 1, m), {});
      const prioHtml = Object.keys(byPrio).length
        ? `<div class="prios">${[5,4,3,2,1].filter(p => byPrio[p]).map(p => `<span class="prio p${p}">P${p}:${byPrio[p]}</span>`).join('')}</div>`
        : '<span class="muted">no TODOs</span>';

      summary.innerHTML =
        `<div class="card"><div class="label">Open PRs</div><div class="value">${totalOpenPrs}</div></div>` +
        `<div class="card"><div class="label">Repos with red CI</div><div class="value ${redCi ? 'fail' : ''}">${redCi}</div></div>` +
        `<div class="card"><div class="label">Longest-open PR</div><div class="value">${oldestHtml}</div></div>` +
        `<div class="card"><div class="label">TODOs by priority</div>${prioHtml}</div>`;
    }

    async function show(tab) {
      document.getElementById('tab-status').classList.toggle('active', tab==='status');
      document.getElementById('tab-todos').classList.toggle('active', tab==='todos');
      const l = document.getElementById('loading'); l.textContent = 'loading…';
      const view = document.getElementById('view');
      try {
        const [statusRows, todoRows] = await Promise.all([
          (await fetch('/api/status')).json(),
          (await fetch('/api/todos')).json(),
        ]);
        renderSummary(statusRows, todoRows);

        if (tab === 'status') {
          const rows = statusRows;
          const ok = rows.filter(r => !r.error).length;
          view.innerHTML = `<p class="muted">${rows.length} repos — ${ok} ok, ${rows.length-ok} degraded</p>` +
            `<table><thead><tr><th>Repo</th><th>CI</th><th>Open PRs</th><th>Last commit</th></tr></thead><tbody>` +
            rows.map(r => {
              const [cls,label] = ci(r.ci);
              const tags = (r.stale ? `<span class="tag tag-cached" title="${esc(r.error||'')}">cached</span>` : '') +
                           (r.ciChanged ? '<span class="tag tag-changed">changed</span>' : '');
              const ciCell = (r.ciDetail ? `<span class="${cls}" title="${esc(r.ciDetail)}">${label}</span>` : `<span class="${cls}">${label}</span>`) + tags;
              const commit = r.lastCommit
                ? `<code>${esc(r.lastCommit.sha)}</code> ${esc(r.lastCommit.message)} <span class="muted">${esc((r.lastCommit.date||'').slice(0,10))}</span>`
                : (r.error ? `<span class="fail">${esc(r.error)}</span>` : '<span class="muted">-</span>');
              return `<tr class="${r.stale ? 'stale' : ''}"><td>${esc(r.fullName)}</td><td>${ciCell}</td><td>${r.openPrs}</td><td>${commit}</td></tr>`;
            }).join('') + `</tbody></table>`;
        } else {
          const rows = todoRows;
          view.innerHTML = `<table><thead><tr><th>Prio</th><th>Marker</th><th>Location</th><th>Text</th></tr></thead><tbody>` +
            rows.map(t => `<tr><td><span class="prio p${t.priority}">P${t.priority}</span></td><td>${esc(t.marker)}</td><td class="muted">${esc(t.repo)}/${esc(t.file)}:${t.line}</td><td>${esc(t.text)}</td></tr>`).join('') +
            `</tbody></table>`;
        }
      } catch (e) {
        view.innerHTML = `<p class="fail">Failed to load: ${esc(String(e))}</p>`;
      } finally { l.textContent = ''; }
    }
    function esc(s){return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    show('status');
  </script>
</body>
</html>
